<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="shikakaiBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FAF7EF" />
      <stop offset="65%" stop-color="#F2EBDD" />
      <stop offset="100%" stop-color="#EADBCE" />
    </radialGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A67C" />
      <stop offset="35%" stop-color="#DFBF95" />
      <stop offset="70%" stop-color="#DFBF95" />
      <stop offset="100%" stop-color="#A58356" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#shikakaiBg)" />
  <circle cx="400" cy="400" r="280" fill="none" stroke="#DCE7D6" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Whole dried Shikakai pods left and right -->
  <g id="shikakaiPods">
    <!-- Pod 1 -->
    <path d="M 170 580 C 180 540 220 520 250 540 C 270 530 290 550 280 570 C 290 600 240 620 200 600 Z" fill="#4B2816" />
    <path d="M 180 585 C 220 545 270 560 270 590" stroke="#724427" stroke-width="2" fill="none" />
    <!-- Pod 2 -->
    <path d="M 540 580 C 560 540 600 530 630 550 C 650 570 630 600 590 610 Z" fill="#3D1F10" />
    <!-- Fine herbal powder texture in clay katori -->
    <ellipse cx="230" cy="650" rx="45" ry="18" fill="#755030" />
    <ellipse cx="230" cy="648" rx="42" ry="14" fill="#93673F" />
  </g>

  <!-- Pouch Drop Shadow -->
  <ellipse cx="400" cy="670" rx="140" ry="24" fill="#183D2B" opacity="0.22" filter="blur(10px)" />

  <!-- Stand-up Craft Paper Pouch -->
  <g>
    <!-- Main Pouch Body -->
    <path d="M 280 250 L 520 250 L 545 620 C 545 640 525 650 500 650 L 300 650 C 275 650 255 640 255 620 Z" fill="url(#pouchGrad)" />
    
    <!-- Top Zip Lock Seal -->
    <rect x="270" y="240" width="260" height="20" rx="4" fill="#8F6E45" />
    <line x1="280" y1="250" x2="520" y2="250" stroke="#5E4324" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Center Label on Pouch -->
    <rect x="310" y="330" width="180" height="250" rx="10" fill="#FAF7EF" stroke="#527A50" stroke-width="1" />

    <circle cx="400" cy="370" r="14" fill="#183D2B" />
    <text x="400" y="402" font-family="'DM Serif Display', Georgia, serif" font-size="11" font-weight="bold" fill="#183D2B" text-anchor="middle" letter-spacing="1">HERBALROOTS</text>

    <line x1="340" y1="414" x2="460" y2="414" stroke="#B86D4B" stroke-width="1" />

    <text x="400" y="438" font-family="'DM Serif Display', Georgia, serif" font-size="15" font-weight="bold" fill="#183D2B" text-anchor="middle">KESH SUDHA</text>
    <text x="400" y="458" font-family="'DM Serif Display', Georgia, serif" font-size="14" fill="#527A50" text-anchor="middle">Pure Shikakai</text>
    <text x="400" y="476" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" fill="#B86D4B" text-anchor="middle" letter-spacing="1">HERBAL POD CLEANSER</text>

    <text x="400" y="504" font-family="'Inter', sans-serif" font-size="6.5" fill="#6D756B" text-anchor="middle">100% Stone-Milled Pods</text>
    <text x="400" y="518" font-family="'Inter', sans-serif" font-size="6" fill="#527A50" text-anchor="middle">Low-Foaming Saponin Wash</text>

    <line x1="345" y1="534" x2="455" y2="534" stroke="#DCE7D6" stroke-width="1" />
    <text x="400" y="552" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" fill="#183D2B" text-anchor="middle">100 g / 3.52 oz.</text>
  </g>
</svg>
