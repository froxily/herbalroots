<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FAF7EF" />
      <stop offset="65%" stop-color="#F2EBDD" />
      <stop offset="100%" stop-color="#DCE7D6" />
    </radialGradient>
    <linearGradient id="amberBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A260F" />
      <stop offset="25%" stop-color="#7B4219" />
      <stop offset="50%" stop-color="#B86D4B" />
      <stop offset="75%" stop-color="#7B4219" />
      <stop offset="100%" stop-color="#3A1D0B" />
    </linearGradient>
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2A03F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#9C5A18" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF7EF" />
      <stop offset="100%" stop-color="#F2EBDD" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#183D2B" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Botanical Decorative Ring -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#DCE7D6" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Botanical Leaves in Background (Bhringraj / Eclipta Alba) -->
  <g opacity="0.85">
    <!-- Left Leaves -->
    <path d="M 230 450 C 150 420 160 300 240 280 C 260 340 250 420 230 450 Z" fill="#527A50" />
    <path d="M 230 450 Q 200 365 240 280" stroke="#FAF7EF" stroke-width="2" fill="none" opacity="0.5" />
    
    <path d="M 210 520 C 120 530 110 420 180 390 C 210 430 210 490 210 520 Z" fill="#6E986C" />
    <path d="M 210 520 Q 165 460 180 390" stroke="#FAF7EF" stroke-width="1.5" fill="none" opacity="0.5" />

    <!-- Right Leaves -->
    <path d="M 570 450 C 650 420 640 300 560 280 C 540 340 550 420 570 450 Z" fill="#527A50" />
    <path d="M 570 450 Q 600 365 560 280" stroke="#FAF7EF" stroke-width="2" fill="none" opacity="0.5" />

    <path d="M 590 530 C 680 540 690 430 620 400 C 590 440 590 500 590 530 Z" fill="#6E986C" />
    <!-- Small Eclipta Daisy Blossom -->
    <circle cx="280" cy="270" r="14" fill="#FFFFFF" />
    <circle cx="280" cy="270" r="6" fill="#E2A03F" />
    <circle cx="530" cy="260" r="14" fill="#FFFFFF" />
    <circle cx="530" cy="260" r="6" fill="#E2A03F" />
  </g>

  <!-- Bottle Drop Shadow -->
  <ellipse cx="400" cy="670" rx="130" ry="24" fill="#183D2B" opacity="0.22" filter="blur(10px)" />

  <!-- Main Glass Bottle Body -->
  <g filter="url(#softShadow)">
    <!-- Main Bottle Cylinder -->
    <rect x="300" y="270" width="200" height="370" rx="40" fill="url(#amberBottle)" />

    <!-- Inner Golden Ayurvedic Oil Level -->
    <rect x="312" y="320" width="176" height="305" rx="28" fill="url(#oilGrad)" opacity="0.75" />

    <!-- Glass Specular Highlight on Left -->
    <rect x="320" y="290" width="16" height="330" rx="8" fill="#FFFFFF" opacity="0.3" />
    <!-- Subtle Specular Reflection Right -->
    <rect x="466" y="290" width="8" height="330" rx="4" fill="#FFFFFF" opacity="0.15" />

    <!-- Bottle Neck -->
    <path d="M 360 270 L 360 200 L 440 200 L 440 270 Z" fill="url(#amberBottle)" />
    <!-- Neck Collar -->
    <rect x="350" y="190" width="100" height="18" rx="6" fill="#3A1D0B" />

    <!-- Dropper Pipette / Wooden Cap -->
    <rect x="356" y="130" width="88" height="60" rx="8" fill="#183D2B" />
    <!-- Cap Ridges -->
    <line x1="370" y1="135" x2="370" y2="185" stroke="#23533B" stroke-width="2" />
    <line x1="385" y1="135" x2="385" y2="185" stroke="#23533B" stroke-width="2" />
    <line x1="400" y1="135" x2="400" y2="185" stroke="#23533B" stroke-width="2" />
    <line x1="415" y1="135" x2="415" y2="185" stroke="#23533B" stroke-width="2" />
    <line x1="430" y1="135" x2="430" y2="185" stroke="#23533B" stroke-width="2" />
    <!-- Rubber Pipette Bulb -->
    <path d="M 378 130 C 378 95 422 95 422 130 Z" fill="#252B25" />

    <!-- Botanical Product Label -->
    <rect x="324" y="360" width="152" height="210" rx="8" fill="url(#labelGrad)" />
    <rect x="330" y="366" width="140" height="198" rx="6" fill="none" stroke="#527A50" stroke-width="1" />

    <!-- Brand Label Graphics -->
    <circle cx="400" cy="395" r="14" fill="#183D2B" />
    <path d="M 400 387 C 400 387 405 391 405 395 C 405 398 402 400 400 401 C 398 400 395 398 395 395 C 395 391 400 387 400 387 Z" fill="#DCE7D6" />

    <!-- Brand Typography on Label -->
    <text x="400" y="425" font-family="'DM Serif Display', Georgia, serif" font-size="11" font-weight="bold" fill="#183D2B" text-anchor="middle" letter-spacing="1">HERBALROOTS</text>
    <text x="400" y="437" font-family="'Inter', sans-serif" font-size="6" fill="#6D756B" text-anchor="middle" letter-spacing="1.5">AYURVEDA</text>

    <line x1="355" y1="446" x2="445" y2="446" stroke="#B86D4B" stroke-width="1" />

    <text x="400" y="465" font-family="'DM Serif Display', Georgia, serif" font-size="15" font-weight="bold" fill="#183D2B" text-anchor="middle">KESHYA</text>
    <text x="400" y="482" font-family="'DM Serif Display', Georgia, serif" font-size="13" fill="#183D2B" text-anchor="middle">Bhringraj</text>
    <text x="400" y="497" font-family="'Inter', sans-serif" font-size="7" font-weight="bold" fill="#B86D4B" text-anchor="middle" letter-spacing="1">INTENSIVE HAIR OIL</text>

    <text x="400" y="520" font-family="'Inter', sans-serif" font-size="6.5" fill="#6D756B" text-anchor="middle">Kshirapak Vidhi • Cold-Pressed</text>
    <text x="400" y="532" font-family="'Inter', sans-serif" font-size="6" fill="#527A50" text-anchor="middle">Eclipta Alba &amp; Sesame Base</text>

    <line x1="365" y1="544" x2="435" y2="544" stroke="#DCE7D6" stroke-width="1" />
    <text x="400" y="556" font-family="'Inter', sans-serif" font-size="6.5" font-weight="bold" fill="#183D2B" text-anchor="middle">100 ml / 3.38 fl. oz.</text>
  </g>

  <!-- Foreground Droplet & Seed Accents -->
  <ellipse cx="400" cy="710" rx="14" ry="22" fill="#E2A03F" opacity="0.8" transform="rotate(-25 400 710)" />
  <circle cx="395" cy="705" r="4" fill="#FFFFFF" opacity="0.7" />
  
  <!-- Black Sesame Seeds on Surface -->
  <ellipse cx="260" cy="650" rx="6" ry="10" fill="#252B25" transform="rotate(35 260 650)" />
  <ellipse cx="280" cy="665" rx="5" ry="9" fill="#252B25" transform="rotate(-15 280 665)" />
  <ellipse cx="525" cy="660" rx="6" ry="10" fill="#252B25" transform="rotate(50 525 660)" />
  <ellipse cx="545" cy="645" rx="5" ry="9" fill="#252B25" transform="rotate(-40 545 645)" />
</svg>
